backend:
  name: git-gateway
  branch: mtest

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "services"
    label: "🎈 Services"
    folder: "content/services"
    create: true
    slug: "{{slug}}"
    format: "json"
    extension: "json"
    fields:
      - { label: "ID", name: "id", widget: "number", default: 1 }
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Sous-titre", name: "subtitle", widget: "string" }
      - { label: "Badge", name: "badge", widget: "string" }
      - { label: "Description courte", name: "description", widget: "text" }
      - { label: "Description longue", name: "longDescription", widget: "text" }
      - { label: "Prix départ", name: "basePrice", widget: "number" }
      - { label: "Prix affiché", name: "priceRange", widget: "string" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Durée", name: "duration", widget: "string" }
      - { label: "Couverture", name: "coverage", widget: "string" }
      - label: "Packs"
        name: "packs"
        widget: "list"
        required: false
        fields:
          - { label: "Nom", name: "name", widget: "string" }
          - { label: "Prix", name: "price", widget: "number" }
          - { label: "Description", name: "desc", widget: "text" }
      - label: "Inclus"
        name: "includes"
        widget: "list"
        field: { label: "Item", name: "item", widget: "string" }
      - label: "Options"
        name: "options"
        widget: "list"
        required: false
        fields:
          - { label: "Nom", name: "name", widget: "string" }
          - { label: "Prix", name: "price", widget: "number" }
          - { label: "Note", name: "note", widget: "string", required: false }

  - name: "gift_baskets"
    label: "🎁 Paniers cadeaux"
    folder: "content/gift_baskets"
    create: true
    slug: "{{slug}}"
    format: "json"
    extension: "json"
    fields:
      - { label: "ID", name: "id", widget: "number" }
      - { label: "Nom", name: "name", widget: "string" }
      - { label: "Sous-titre", name: "subtitle", widget: "string" }
      - { label: "Badge", name: "badge", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Description longue", name: "longDescription", widget: "text" }
      - { label: "Prix standard", name: "priceStandard", widget: "number" }
      - { label: "Prix premium", name: "pricePremium", widget: "number" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Populaire", name: "popular", widget: "boolean", default: false }
      - label: "Contenu"
        name: "includes"
        widget: "list"
        field: { label: "Item", name: "item", widget: "string" }

# public/admin/config.yml - Version améliorée avec conditionnal display
  - name: "realisations"
    label: "📸 Réalisations"
    folder: "content/realisations"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    format: "json"
    extension: "json"
    fields:
      - { label: "ID", name: "id", widget: "number" }
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Catégorie", name: "category", widget: "string" }
      
      - label: "Type de média"
        name: "mediaType"
        widget: "select"
        options:
          - { label: "Image seule", value: "image" }
          - { label: "Vidéo (upload ou lien)", value: "video" }
        default: "image"
      
      - label: "Image principale"
        name: "image"
        widget: "image"
        required: false
        hint: "Pour les images OU comme miniature pour les vidéos"
      
      - label: "Options Vidéo"
        name: "video_options"
        widget: "object"
        required: false
        hint: "Soit uploader un fichier, soit mettre un lien"
        fields:
          - label: "Uploader une vidéo"
            name: "upload"
            widget: "file"
            required: false
            media_folder: "../../public/videos/uploads"
            public_folder: "/videos/uploads"
            accept: [".mp4", ".webm", ".ogg"]
            hint: "Formats supportés: MP4, WebM, OGG"
          
          - label: "Ou lien YouTube/Vimeo"
            name: "link"
            widget: "string"
            required: false
            hint: "https://youtube.com/watch?v=... ou https://vimeo.com/..."
      
      - label: "Miniature personnalisée (optionnelle)"
        name: "thumbnail"
        widget: "image"
        required: false
        hint: "Image d'aperçu pour la vidéo (laissez vide pour utiliser l'image principale)"    label: "📸 Réalisations"
